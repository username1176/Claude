# ZeroTax AI — Docker Compose
# Usage: docker compose up -d
version: "3.9"

services:
  zerotax:
    build: .
    image: zerotax-ai:latest
    container_name: zerotax_app
    ports:
      - "8501:8501"
    volumes:
      - zerotax_data:/data         # Persistent SQLite database
    environment:
      - ZEROTAX_DB=/data/zerotax.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  zerotax_data:
    driver: local
